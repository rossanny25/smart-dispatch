<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Dispatch IA - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="index.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card card-glow">
      <div class="login-brand">
        <i class="fa-solid fa-shield-halved logo-icon"></i>
        <div>
          <h1>Smart Dispatch IA</h1>
          <p>Acceso operativo</p>
        </div>
      </div>

      <form class="login-form" method="post" action="/auth/login">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Clave</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <p class="login-error" id="login-error" hidden>Usuario o clave inválidos.</p>
        <button type="submit" class="btn btn-primary login-submit">
          <i class="fa-solid fa-right-to-bracket"></i> Ingresar
        </button>
      </form>
      <button type="button" class="btn btn-secondary forgot-password-btn" id="forgot-password-btn">
        <i class="fa-solid fa-key"></i> Olvidé mi contraseña
      </button>
      <p class="login-help-message" id="forgot-password-message" hidden>
        Solicita a un administrador activo que restablezca tu clave desde el panel de usuarios.
      </p>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === '1') {
      document.getElementById('login-error').hidden = false;
    }
    document.getElementById('forgot-password-btn').addEventListener('click', () => {
      document.getElementById('forgot-password-message').hidden = false;
    });
  </script>
</body>
</html>
