services:
  smart-dispatch:
    environment:
      SMART_DISPATCH_ANALYZE_ADAPTER: ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-8}
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: smart-dispatch-ollama
    ports:
      - "11434:11434"
    volumes:
      - smart_dispatch_ollama:/root/.ollama
    restart: unless-stopped

volumes:
  smart_dispatch_ollama:
